<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Milly, the MineBig beaver mascot, waving with a gold nugget">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c6b3f"/>
      <stop offset="1" stop-color="#6d4426"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b88650"/>
      <stop offset="1" stop-color="#8a5a33"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc193"/>
      <stop offset="1" stop-color="#d9a066"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#f0a80a"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57402c"/>
      <stop offset="1" stop-color="#3a2a1c"/>
    </linearGradient>
    <radialGradient id="nugget" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#d9970a"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1a120a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- shadow -->
  <ellipse cx="100" cy="184" rx="62" ry="10" fill="#000" opacity="0.18"/>

  <!-- flat tail behind -->
  <g filter="url(#soft)">
    <path d="M28 128 C14 118 12 96 26 88 C40 80 62 86 66 98 L72 132 C74 146 62 152 46 150 Z" fill="url(#tail)"/>
    <path d="M30 118 C24 110 24 98 34 92 C44 86 56 90 58 98" fill="none" stroke="#2c1f12" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- body -->
  <g filter="url(#soft)">
    <path d="M58 116 C52 92 66 72 100 72 C134 72 148 92 142 116 C138 150 128 172 100 172 C72 172 62 150 58 116 Z" fill="url(#fur)"/>
    <path d="M78 92 C76 108 82 122 100 122 C118 122 124 108 122 92 C118 78 82 78 78 92 Z" fill="url(#muzzle)" opacity="0.95"/>
  </g>

  <!-- legs -->
  <g filter="url(#soft)">
    <ellipse cx="82" cy="168" rx="17" ry="11" fill="#5c3a20"/>
    <ellipse cx="118" cy="168" rx="17" ry="11" fill="#5c3a20"/>
  </g>

  <!-- waving arm + nugget -->
  <g filter="url(#soft)">
    <path d="M52 122 C40 112 38 92 48 80 C54 72 66 72 70 80 L72 96 C74 110 68 122 58 124 Z" fill="url(#furLight)"/>
    <path d="M44 74 C42 64 46 56 54 54 C60 52 64 56 63 62 L61 70 Z" fill="#8a5a33"/>
    <path d="M46 62 C42 54 46 44 55 42 C62 40 68 45 67 52 L66 60 Z" fill="#8a5a33"/>
    <path d="M44 48 C46 36 58 26 71 28 C80 29 84 36 80 44 L74 50 C70 54 64 54 60 50 C54 55 46 55 44 48 Z" fill="url(#nugget)" stroke="#b97c08" stroke-width="2.5"/>
    <path d="M54 44 C58 38 66 37 70 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- resting arm -->
  <g filter="url(#soft)">
    <path d="M148 122 C160 112 162 94 153 84 C146 76 134 78 130 86 L128 100 C126 112 134 122 144 124 Z" fill="url(#furLight)"/>
  </g>

  <!-- head -->
  <g filter="url(#soft)">
    <path d="M76 74 C74 56 84 40 100 40 C116 40 126 56 124 74 C122 88 112 96 100 96 C88 96 78 88 76 74 Z" fill="url(#fur)"/>
    <!-- ears -->
    <ellipse cx="80" cy="46" rx="9" ry="11" fill="url(#furLight)"/>
    <ellipse cx="80" cy="46" rx="4.5" ry="6" fill="#e9b98c"/>
    <ellipse cx="120" cy="46" rx="9" ry="11" fill="url(#furLight)"/>
    <ellipse cx="120" cy="46" rx="4.5" ry="6" fill="#e9b98c"/>
    <!-- muzzle -->
    <ellipse cx="100" cy="82" rx="24" ry="17" fill="url(#muzzle)"/>
    <!-- nose -->
    <ellipse cx="100" cy="74" rx="7" ry="5.5" fill="#3b2415"/>
    <ellipse cx="98" cy="72.5" rx="2.2" ry="1.8" fill="#fff" opacity="0.7"/>
    <!-- teeth -->
    <rect x="92.5" y="84" width="7" height="10" rx="2.5" fill="#fff" stroke="#e3d9c8" stroke-width="1"/>
    <rect x="100.5" y="84" width="7" height="10" rx="2.5" fill="#fff" stroke="#e3d9c8" stroke-width="1"/>
    <!-- eyes -->
    <ellipse cx="85" cy="63" rx="5" ry="5.8" fill="#241a12"/>
    <circle cx="86.6" cy="60.8" r="1.8" fill="#fff"/>
    <ellipse cx="115" cy="63" rx="5" ry="5.8" fill="#241a12"/>
    <circle cx="116.6" cy="60.8" r="1.8" fill="#fff"/>
    <!-- blush -->
    <ellipse cx="78" cy="74" rx="4" ry="2.6" fill="#e98a5a" opacity="0.55"/>
    <ellipse cx="122" cy="74" rx="4" ry="2.6" fill="#e98a5a" opacity="0.55"/>
  </g>

  <!-- miner hard hat -->
  <g filter="url(#soft)">
    <path d="M70 44 C70 26 84 16 100 16 C116 16 130 26 130 44 L126 50 L74 50 Z" fill="url(#hat)"/>
    <rect x="64" y="49" width="72" height="8" rx="4" fill="#f0a80a"/>
    <rect x="88" y="34" width="24" height="12" rx="5" fill="#fff8e1" stroke="#e3d9c8" stroke-width="1.5"/>
    <circle cx="100" cy="40" r="4.5" fill="#ffd54f" stroke="#d9970a" stroke-width="1.5"/>
    <path d="M84 16 C88 12 112 12 116 16" fill="none" stroke="#f7c94b" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
